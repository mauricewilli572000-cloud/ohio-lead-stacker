name: Send GHL test lead

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send one sample lead to the GHL webhook
        env:
          GHL_WEBHOOK_URL: ${{ secrets.GHL_WEBHOOK_URL }}
        run: python ghl_test.py
