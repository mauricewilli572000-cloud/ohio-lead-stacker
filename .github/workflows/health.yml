name: Scraper health check

on:
  schedule:
    - cron: "47 15 * * *"   # ~10:47 AM Eastern, after the scrapers and the stacker have run
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: ohio-lead-stacker
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every scraper repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python health.py --issue
      - name: Commit health page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/health.json
          git diff --cached --quiet || git commit -m "Health check: $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
