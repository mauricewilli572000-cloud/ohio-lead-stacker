name: Stack leads

on:
  schedule:
    - cron: "13 14 * * *"   # ~9:13 AM Eastern, after every scraper's morning run has finished
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ohio-lead-stacker
  cancel-in-progress: false

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest curl_cffi   # curl_cffi: browser-like downloads from the Franklin Auditor

      # Last good copy of each feed, used if a scraper's feed can't be read today.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      - name: Run tests
        run: python -m pytest -q tests

      - name: Stack leads
        run: python run_stacker.py   # reads each scraper's published feed; never writes to those repos

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stacked.json docs/stacked_ghl.csv data/history.json
          git diff --cached --quiet || git commit -m "Stacked leads: daily update"
          git push
